<header class="gn-header sticky-top">
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <app-logo [size]="34" />
        <span class="gn-wordmark">Guild<span class="text-gradient">Net</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
        <i class="bi bi-list fs-3"></i>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto ms-md-4 gap-md-1">
          @if (user()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/communities" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <i class="bi bi-house-door me-1"></i>Inicio
              </a>
            </li>
          }
          <li class="nav-item">
            <a class="nav-link" routerLink="/communities/search" routerLinkActive="active">
              <i class="bi bi-compass me-1"></i>Explorar
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2 mt-3 mt-md-0">
          <!-- Selector de tema -->
          <div class="dropdown">
            <button class="btn btn-icon" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Cambiar tema" title="Tema">
              <i class="bi" [class.bi-sun]="theme.active() === 'light'" [class.bi-moon-stars]="theme.active() === 'dark'"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              @for (option of themeOptions; track option.value) {
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center gap-2" [class.active]="theme.preference() === option.value" (click)="theme.set(option.value)">
                    <i class="bi bi-{{ option.icon }}"></i>{{ option.label }}
                  </button>
                </li>
              }
            </ul>
          </div>

          @if (user(); as u) {
            <a class="btn btn-primary d-none d-lg-inline-flex align-items-center" routerLink="/communities/create">
              <i class="bi bi-plus-lg me-1"></i>Crear comunidad
            </a>
            <div class="dropdown">
              <button class="btn gn-user-btn d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <app-avatar [src]="u.profileImage" [size]="32" [alt]="u.username" />
                <span class="d-md-none d-xl-inline fw-semibold">{{ u.username }}</span>
                <i class="bi bi-chevron-down small"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><h6 class="dropdown-header">{{ u.email }}</h6></li>
                <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
                <li><a class="dropdown-item d-lg-none" routerLink="/communities/create"><i class="bi bi-plus-circle me-2"></i>Crear comunidad</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><button type="button" class="dropdown-item text-danger" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button></li>
              </ul>
            </div>
          } @else {
            <a class="btn btn-outline-primary" routerLink="/login">Iniciar sesión</a>
            <a class="btn btn-primary" routerLink="/register">Registrarse</a>
          }
        </div>
      </div>
    </div>
  </nav>
</header>

<div class="container py-4">
  <h1 class="h3 fw-bold mb-3">Explorar comunidades</h1>

  <div class="card gn-filter-card mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold" for="searchName">Nombre</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input id="searchName" type="search" class="form-control" placeholder="Ej. Fotografía" [formControl]="nameControl" />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold" for="searchTags">Etiquetas</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-hash"></i></span>
            <input id="searchTags" type="search" class="form-control" placeholder="Separadas por comas: juegos, arte" [formControl]="tagsControl" />
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else if (results().length) {
    <p class="text-body-secondary small">{{ results().length }} {{ results().length === 1 ? 'comunidad encontrada' : 'comunidades encontradas' }}</p>
    <div class="row g-3">
      @for (community of results(); track community.id) {
        <div class="col-sm-6 col-lg-4">
          <app-community-card [community]="community" [member]="isMember(community)" (selected)="selected.set($event)" />
        </div>
      }
    </div>
  } @else if (!loading()) {
    <app-empty-state icon="search" message="No se encontraron comunidades con esos criterios." />
  }
</div>

<app-community-preview [community]="selected()" [member]="selectedIsMember()" (closed)="selected.set(null)" />

@if (community) {
  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4">Editar comunidad</h2>

        <form (ngSubmit)="onSubmit()" [formGroup]="editForm">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input id="name" type="text" class="form-control" formControlName="name" maxlength="100" placeholder="Nombre de la comunidad" />
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <quill-editor formControlName="description" [styles]="{ height: '300px' }"></quill-editor>
          </div>

          <div class="mb-3">
            <label class="form-label">Reglas</label>
            <quill-editor formControlName="rules" [styles]="{ height: '300px' }"></quill-editor>
          </div>

          <div class="mb-3">
            <label for="tags" class="form-label">Etiquetas (separadas por comas)</label>
            <input id="tags" type="text" class="form-control" formControlName="tags" placeholder="ej. arte, videojuegos, comunidad" />
          </div>

          <div class="mb-3">
            <label for="image" class="form-label">Imagen de la comunidad</label>
            <input id="image" type="file" accept="image/png, image/jpeg, image/gif, image/webp" class="form-control" (change)="onImageSelected($event)" />
          </div>

          <div class="mb-3">
            <label for="banner" class="form-label">Banner</label>
            <input id="banner" type="file" accept="image/png, image/jpeg, image/gif, image/webp" class="form-control" (change)="onBannerSelected($event)" />
          </div>

          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }

          <div class="d-flex justify-content-between mt-4">
            <div>
              <button type="submit" class="btn btn-success me-2" [disabled]="editForm.invalid || saving">Guardar cambios</button>
              <a class="btn btn-outline-secondary" [routerLink]="['/communities', community.id]">Cancelar</a>
            </div>
            @if (isOwner) {
              <button type="button" class="btn btn-outline-danger" (click)="onDelete()">Eliminar comunidad</button>
            }
          </div>
        </form>
      </div>
    </div>
  </div>
}

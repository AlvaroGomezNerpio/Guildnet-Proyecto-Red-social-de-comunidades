<app-auth-shell title="Bienvenido de nuevo" subtitle="Inicia sesión para entrar en tus comunidades.">
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email" required email [(ngModel)]="email" />
      <label for="email">Correo electrónico</label>
    </div>

    <div class="form-floating mb-4">
      <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required [(ngModel)]="password" />
      <label for="password">Contraseña</label>
    </div>

    @if (error) {
      <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    }

    <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loginForm.invalid || loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Iniciar sesión
    </button>
  </form>

  <p class="text-center mt-4 mb-0">
    ¿No tienes cuenta? <a routerLink="/register" class="fw-semibold">Regístrate gratis</a>
  </p>
</app-auth-shell>

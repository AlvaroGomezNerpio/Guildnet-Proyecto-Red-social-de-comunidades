<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-body">
      <h2 class="mb-4 text-center">Registro</h2>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Nombre de usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            [(ngModel)]="username"
            required
            maxlength="50"
            autocomplete="username"
            placeholder="TuNombreDeUsuario"
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            autocomplete="email"
            placeholder="ejemplo@correo.com"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            [(ngModel)]="password"
            #passwordInput="ngModel"
            required
            minlength="8"
            maxlength="100"
            autocomplete="new-password"
            placeholder="••••••••"
          />
          <div class="form-text" [class.text-danger]="passwordInput.touched && passwordInput.invalid">
            Mínimo 8 caracteres.
          </div>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">Imagen de perfil (opcional)</label>
          <input
            type="file"
            class="form-control"
            id="image"
            (change)="onFileSelected($event)"
            accept="image/png, image/jpeg, image/gif, image/webp"
          />
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success" [disabled]="registerForm.invalid || loading">
            @if (loading) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            Registrarse
          </button>
        </div>
      </form>

      @if (error) {
        <div class="alert alert-danger mt-3 text-center">{{ error }}</div>
      }

      <p class="text-center mt-3 mb-0 small">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>

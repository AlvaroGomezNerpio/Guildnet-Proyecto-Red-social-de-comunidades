<app-auth-shell title="Crea tu cuenta" subtitle="Únete a GuildNet en menos de un minuto.">
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="username" name="username" placeholder="Nombre" autocomplete="username" required maxlength="50" [(ngModel)]="username" />
      <label for="username">Nombre de usuario</label>
    </div>

    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email" required email [(ngModel)]="email" />
      <label for="email">Correo electrónico</label>
    </div>

    <div class="form-floating mb-1">
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Contraseña"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="100"
        #passwordInput="ngModel"
        [(ngModel)]="password"
        [class.is-invalid]="passwordInput.touched && passwordInput.invalid"
      />
      <label for="password">Contraseña</label>
    </div>
    <div class="form-text mb-3">Mínimo 8 caracteres.</div>

    <div class="mb-4">
      <label for="image" class="form-label small fw-semibold">Imagen de perfil (opcional)</label>
      <input type="file" class="form-control" id="image" accept="image/png, image/jpeg, image/gif, image/webp" (change)="onFileSelected($event)" />
    </div>

    @if (error) {
      <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    }

    <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="registerForm.invalid || loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Crear cuenta
    </button>
  </form>

  <p class="text-center mt-4 mb-0">
    ¿Ya tienes cuenta? <a routerLink="/login" class="fw-semibold">Inicia sesión</a>
  </p>
</app-auth-shell>

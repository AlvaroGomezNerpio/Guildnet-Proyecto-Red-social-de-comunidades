<div class="container py-4 gn-narrow">
  <a class="btn btn-link px-0 mb-3" [routerLink]="['/communities', communityId]">
    <i class="bi bi-arrow-left me-1"></i>Volver a la comunidad
  </a>

  <header class="gn-page-header">
    <span class="gn-page-icon"><i class="bi bi-pencil-square"></i></span>
    <div>
      <h1>Nueva publicación</h1>
      <p class="text-body-secondary mb-0">Comparte algo con la comunidad.</p>
    </div>
  </header>

  @if (postForm) {
    <form class="card" [formGroup]="postForm" (ngSubmit)="onSubmit()" novalidate>
      <section class="gn-form-section">
        <input
          type="text"
          class="form-control form-control-lg fw-semibold mb-3"
          formControlName="title"
          placeholder="Título de la publicación"
          aria-label="Título"
          maxlength="200"
          required
        />

        <div class="gn-editor mb-3">
          <quill-editor formControlName="content" placeholder="Escribe aquí el contenido…" [styles]="{ height: '360px' }" />
        </div>

        @if (categories.length) {
          <span class="form-label small fw-semibold d-block">Categoría</span>
          <div class="mb-3">
            <app-category-select [categories]="categories" [(selected)]="categoryId" />
          </div>
        }

        <div class="form-floating">
          <input type="text" id="tags" class="form-control" formControlName="tags" placeholder="Etiquetas" />
          <label for="tags">Etiquetas</label>
        </div>
        <div class="form-text">Sepáralas con comas. Ejemplo: noticias, análisis, opinión.</div>
      </section>

      <div class="card-footer d-flex flex-column flex-sm-row gap-2 justify-content-end align-items-sm-center p-3">
        @if (errorMessage) {
          <div class="alert alert-danger py-2 mb-0 me-sm-auto"><i class="bi bi-exclamation-circle me-1"></i>{{ errorMessage }}</div>
        }
        <a class="btn btn-outline-secondary" [routerLink]="['/communities', communityId]">Cancelar</a>
        <button type="submit" class="btn btn-primary" [disabled]="postForm.invalid || submitting">
          @if (submitting) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          <i class="bi bi-send me-1"></i>Publicar
        </button>
      </div>
    </form>
  } @else if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }
</div>

<div class="container py-4 gn-narrow">
  <a class="btn btn-link px-0 mb-2" [routerLink]="['/communities', communityId]">
    <i class="bi bi-arrow-left me-1"></i>Volver a la comunidad
  </a>
  <h1 class="h3 fw-bold mb-3">Buscar publicaciones</h1>

  <div class="card gn-filter-card mb-4">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label small fw-semibold" for="postTitle">Título</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="postTitle" type="search" class="form-control" placeholder="Palabras del título" [formControl]="titleControl" />
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-semibold" for="postTags">Etiquetas</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-hash"></i></span>
          <input id="postTags" type="search" class="form-control" placeholder="Separadas por comas" [formControl]="tagsControl" />
        </div>
      </div>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else {
    @if (results().length) {
      <p class="text-body-secondary small">{{ total() }} {{ total() === 1 ? 'resultado' : 'resultados' }}</p>
    }
    @for (post of results(); track post.id) {
      <app-post-card [post]="post" />
    } @empty {
      @if (!loading()) {
        <app-empty-state icon="search" message="No hay publicaciones que coincidan con la búsqueda." />
      }
    }
    @if (hasMore()) {
      <div class="text-center my-3">
        <button class="btn btn-outline-primary" (click)="search(true)" [disabled]="loading()">Cargar más</button>
      </div>
    }
  }
</div>

spring.application.name=guildnet-backend
server.port=8080

# ------------------------------------------------------------------
# Base de datos (MySQL local). Se puede sobrescribir con variables de entorno.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guildnet_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
# Carga las colecciones relacionadas por lotes en lugar de una consulta por fila (evita N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ------------------------------------------------------------------
# Subida de archivos
# ------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ------------------------------------------------------------------
# Configuración propia de GuildNet
# ------------------------------------------------------------------
# URL con la que el navegador accede al backend (se usa en las URLs de las imágenes)
guildnet.public-url=${PUBLIC_URL:http://localhost:${server.port}}
guildnet.uploads.dir=${UPLOADS_DIR:uploads}
guildnet.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Clave de firma de los JWT (mínimo 32 caracteres). Cámbiala con la variable de entorno JWT_SECRET.
# El valor por defecto solo sirve para desarrollo local.
guildnet.jwt.secret=${JWT_SECRET:guildnet-dev-only-secret-change-me-0123456789}
guildnet.jwt.expiration=24h

# Crea usuarios, comunidades y publicaciones de ejemplo si la base de datos está vacía.
guildnet.demo-data=${DEMO_DATA:true}
# Carpeta con imágenes para los datos de ejemplo (avatares, iconos y banners). No se sube al repositorio:
# si no existe, los datos de ejemplo se crean sin imágenes.
guildnet.demo-images.dir=${DEMO_IMAGES_DIR:${user.home}/Pictures/Pokemon}
